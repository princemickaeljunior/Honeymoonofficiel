<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeymoon · Creator Space</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #d6a94e;
  --gold-light: #f2d270;
  --dark: #1e1245;
  --darker: #140d30;
  --card: #261550;
  --cream: #faf6f0;
  --muted: rgba(245,240,232,0.6);
  --success: #86efac;
  --error: #fca5a5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--darker);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(214,169,78,0.08) 0%, transparent 70%), var(--darker);
}
.login-box {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border: 1px solid rgba(214,169,78,0.2);
  padding: 40px 32px;
}
.login-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 300;
  color: var(--gold);
  letter-spacing: 0.3em;
  text-align: center;
  margin-bottom: 8px;
}
.login-sub {
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 32px;
}
.login-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}
.login-input {
  width: 100%;
  background: rgba(214,169,78,0.04);
  border: 1px solid rgba(214,169,78,0.2);
  padding: 12px 14px;
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}
.login-input:focus { border-color: rgba(214,169,78,0.6); }
.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: var(--darker);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 8px;
}
.login-btn:hover { background: var(--gold-light); }
.login-msg {
  text-align: center;
  font-size: 11px;
  margin-top: 12px;
  min-height: 20px;
  letter-spacing: 0.1em;
}

/* ── DASHBOARD ── */
#dashboard {
  display: none;
  min-height: 100vh;
}

/* Header */
.dash-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: var(--darker);
  border-bottom: 1px solid rgba(214,169,78,0.15);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dash-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 300;
  color: var(--gold);
  letter-spacing: 0.4em;
}
.dash-creator-name {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
}
.dash-logout {
  background: none;
  border: 1px solid rgba(214,169,78,0.2);
  color: var(--muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.dash-logout:hover { border-color: var(--gold); color: var(--gold); }

/* Nav tabs */
.dash-nav {
  position: fixed;
  top: 57px; left: 0; right: 0;
  z-index: 99;
  background: var(--dark);
  border-bottom: 1px solid rgba(214,169,78,0.1);
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}
.dash-nav::-webkit-scrollbar { display: none; }
.dash-tab {
  flex: 0 0 auto;
  padding: 12px 18px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.dash-tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* Content */
.dash-content {
  padding-top: 110px;
  padding-bottom: 40px;
  max-width: 600px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
}

/* Sections */
.dash-section { display: none; }
.dash-section.active { display: block; }

/* Cards */
.dash-card {
  background: var(--card);
  border: 1px solid rgba(214,169,78,0.12);
  padding: 24px;
  margin-bottom: 16px;
}
.dash-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 300;
  color: var(--cream);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(214,169,78,0.1);
}

/* Fields */
.field-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 6px;
  margin-top: 14px;
}
.field-label:first-child { margin-top: 0; }
.field-input, .field-textarea, .field-select {
  width: 100%;
  background: rgba(214,169,78,0.03);
  border: 1px solid rgba(214,169,78,0.15);
  padding: 10px 12px;
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.3s;
}
.field-input:focus, .field-textarea:focus, .field-select:focus {
  border-color: rgba(214,169,78,0.5);
}
.field-textarea { resize: vertical; min-height: 80px; }
.field-select option { background: var(--dark); }

/* Save button */
.save-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: var(--darker);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.3s;
}
.save-btn:hover { background: var(--gold-light); }

/* Toast */
.toast {
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.15em;
  padding: 10px;
  margin-top: 10px;
  display: none;
}
.toast.success { color: var(--success); background: rgba(134,239,172,0.08); border: 1px solid rgba(134,239,172,0.2); }
.toast.error { color: var(--error); background: rgba(252,165,165,0.08); border: 1px solid rgba(252,165,165,0.2); }

/* Photo upload */
.photo-preview {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid rgba(214,169,78,0.3);
  background: var(--dark);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 12px;
  cursor: pointer;
  font-size: 32px;
  color: rgba(214,169,78,0.4);
}
.photo-preview img { width: 100%; height: 100%; object-fit: cover; }

/* Status */
.status-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.status-btn {
  padding: 8px 16px;
  background: none;
  border: 1px solid rgba(214,169,78,0.2);
  color: var(--muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.status-btn.active-status {
  border-color: #4caf50;
  color: #4caf50;
  background: rgba(76,175,80,0.08);
}
.status-btn.soon-status {
  border-color: #ff9800;
  color: #ff9800;
  background: rgba(255,152,0,0.08);
}
.status-btn.away-status {
  border-color: rgba(214,169,78,0.4);
  color: var(--muted);
}

/* Page publique info */
.page-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(214,169,78,0.04);
  border: 1px solid rgba(214,169,78,0.15);
  margin-bottom: 16px;
}
.page-info-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}
.page-info-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--gold);
}
.page-link {
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid rgba(214,169,78,0.3);
  padding: 4px 10px;
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">HM</div>
    <div class="login-sub">Creator Space · Private Access</div>
    <label class="login-label">Email</label>
    <input class="login-input" id="login-email" type="email" placeholder="your@email.com">
    <label class="login-label">Mot de passe</label>
    <input class="login-input" id="login-pwd" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">✦ Accéder à mon espace →</button>
    <div class="login-msg" id="login-msg"></div>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">Honey<em style="font-style:italic;color:var(--gold-light);">moon</em></div>
    <span class="dash-creator-name" id="dash-name-header">Creator</span>
    <button class="dash-logout" onclick="doLogout()">Déconnexion</button>
  </div>

  <div class="dash-nav">
    <button class="dash-tab active" onclick="switchTab('profile', this)">01 · Profil</button>
    <button class="dash-tab" onclick="switchTab('status', this)">02 · Statut</button>
    <button class="dash-tab" onclick="switchTab('links', this)">03 · Liens</button>
    <button class="dash-tab" onclick="switchTab('content', this)">04 · Contenu</button>
  </div>

  <div class="dash-content">

    <!-- Info page publique -->
    <div class="page-info">
      <div>
        <div class="page-info-label">Ta page publique</div>
        <div class="page-info-value" id="dash-page-id">—</div>
      </div>
      <a class="page-link" id="dash-page-link" href="#" target="_blank">Voir →</a>
    </div>

    <!-- ── PROFIL ── -->
    <div class="dash-section active" id="section-profile">
      <div class="dash-card">
        <div class="dash-card-title">Mon Profil</div>

        <!-- Photo -->
        <label class="field-label">Photo de profil</label>
        <div class="photo-preview" id="photo-preview" onclick="document.getElementById('photo-input').click()">
          📷
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="uploadPhoto(event)">
        <input class="field-input" id="f-photo-url" type="text" placeholder="Ou colle une URL d'image">

        <label class="field-label">Nom de scène</label>
        <input class="field-input" id="f-name" type="text" placeholder="Luna, Zara...">

        <label class="field-label">Tagline</label>
        <input class="field-input" id="f-tagline" type="text" placeholder="Mysterious · Exclusive...">

        <label class="field-label">Bio</label>
        <textarea class="field-textarea" id="f-bio" placeholder="Décris-toi en quelques phrases..."></textarea>

        <label class="field-label">Pays</label>
        <input class="field-input" id="f-country" type="text" placeholder="France, Belgique...">

        <label class="field-label">Langues</label>
        <input class="field-input" id="f-languages" type="text" placeholder="Français, English...">

        <button class="save-btn" onclick="saveProfile()">✦ Sauvegarder le profil →</button>
        <div class="toast" id="toast-profile"></div>
      </div>
    </div>

    <!-- ── STATUT ── -->
    <div class="dash-section" id="section-status">
      <div class="dash-card">
        <div class="dash-card-title">Mon Statut Live</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">Mis à jour en temps réel sur ta page publique.</p>
        <div class="status-btns">
          <button class="status-btn" id="btn-active" onclick="saveStatus('active')">🟢 En ligne maintenant</button>
          <button class="status-btn" id="btn-soon" onclick="saveStatus('soon')">🟡 Bientôt en ligne</button>
          <button class="status-btn" id="btn-away" onclick="saveStatus('away')">🔴 Pas disponible</button>
        </div>
        <div class="toast" id="toast-status"></div>
      </div>
    </div>

    <!-- ── LIENS ── -->
    <div class="dash-section" id="section-links">
      <div class="dash-card">
        <div class="dash-card-title">Mes Liens</div>

        <label class="field-label">Telegram (lien canal privé)</label>
        <input class="field-input" id="l-telegram" type="text" placeholder="https://t.me/+...">

        <label class="field-label">BongaCams</label>
        <input class="field-input" id="l-bongacams" type="text" placeholder="https://bongacams.com/...">

        <label class="field-label">Stripchat</label>
        <input class="field-input" id="l-stripchat" type="text" placeholder="https://stripchat.com/...">

        <label class="field-label">OnlyFans</label>
        <input class="field-input" id="l-onlyfans" type="text" placeholder="https://onlyfans.com/...">

        <label class="field-label">Instagram</label>
        <input class="field-input" id="l-instagram" type="text" placeholder="https://instagram.com/...">

        <button class="save-btn" onclick="saveLinks()">✦ Sauvegarder les liens →</button>
        <div class="toast" id="toast-links"></div>
      </div>
    </div>

    <!-- ── CONTENU ── -->
    <div class="dash-section" id="section-content">
      <div class="dash-card">
        <div class="dash-card-title">Upload Contenu</div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">Upload tes photos, vidéos et reels directement sur ta page.</p>

        <label class="field-label">Type de contenu</label>
        <select class="field-select" id="content-type">
          <option value="photo">📸 Photo</option>
          <option value="video">🎥 Vidéo</option>
          <option value="reels">🎬 Reel</option>
          <option value="teaser">⭐ Teaser</option>
        </select>

        <label class="field-label" style="margin-top:14px;">Fichier</label>
        <input type="file" id="content-file" accept="image/*,video/*" style="color:var(--cream);margin-top:4px;">

        <label class="field-label">Prix en tokens (0 = gratuit)</label>
        <input class="field-input" id="content-tokens" type="number" value="0" min="0">

        <button class="save-btn" onclick="uploadContent()">✦ Uploader →</button>
        <div class="toast" id="toast-content"></div>
      </div>
    </div>

  </div>
</div>

<!-- ══ FIREBASE ══ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjeKf3_JL4FxxZQq_d6gdXdmc2Z5RxbaY",
    authDomain: "honeymoonproject2026.firebaseapp.com",
    projectId: "honeymoonproject2026",
    storageBucket: "honeymoonproject2026.firebasestorage.app",
    messagingSenderId: "529825855432",
    appId: "1:529825855432:web:20f97cb88e0ce2d35cf2fd"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let _pageId = null;
  let _unsubscribe = null;

  // ── AUTH STATE ──
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      // Chercher pageId dans creator_accounts
      const accountDoc = await getDoc(doc(db, 'creator_accounts', user.uid));
      if (accountDoc.exists()) {
        _pageId = accountDoc.data().pageId;
        showDashboard(user, _pageId);
      } else {
        // Chercher par email dans creators
        const q = query(collection(db, 'creators'), where('email', '==', user.email));
        const snap = await getDocs(q);
        if (!snap.empty) {
          _pageId = snap.docs[0].id;
          showDashboard(user, _pageId);
        } else {
          showMsg('Aucun profil créatrice trouvé.', 'error');
          await signOut(auth);
        }
      }
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function showDashboard(user, pageId) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    // Info page
    document.getElementById('dash-page-id').textContent = pageId.toUpperCase();
    const link = document.getElementById('dash-page-link');
    link.href = 'https://honeymoonofficiel.vercel.app/#page-' + pageId;

    // Écouter en temps réel les données du profil
    if (_unsubscribe) _unsubscribe();
    _unsubscribe = onSnapshot(doc(db, 'creators', pageId), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        loadProfileFields(data);
      }
    });
  }

  function loadProfileFields(data) {
    document.getElementById('dash-name-header').textContent = data.name || 'Creator';
    document.getElementById('f-name').value = data.name || '';
    document.getElementById('f-tagline').value = data.tagline || '';
    document.getElementById('f-bio').value = data.bio || '';
    document.getElementById('f-country').value = data.country || '';
    document.getElementById('f-languages').value = data.languages || '';
    document.getElementById('f-photo-url').value = data.photo || '';
    document.getElementById('l-telegram').value = data.link_telegram || '';
    document.getElementById('l-bongacams').value = data.link_bongacams || '';
    document.getElementById('l-stripchat').value = data.link_stripchat || '';
    document.getElementById('l-onlyfans').value = data.link_onlyfans || '';
    document.getElementById('l-instagram').value = data.link_instagram || '';

    // Photo preview
    if (data.photo) {
      document.getElementById('photo-preview').innerHTML = '<img src="' + data.photo + '">';
    }

    // Statut
    ['active','soon','away'].forEach(s => {
      document.getElementById('btn-' + s).className = 'status-btn ' + (data.status === s ? s + '-status' : '');
    });
  }

  // ── LOGIN ──
  window.doLogin = async function() {
    const email = document.getElementById('login-email').value.trim();
    const pwd = document.getElementById('login-pwd').value;
    if (!email || !pwd) { showMsg('Remplissez tous les champs.', 'error'); return; }
    showMsg('Connexion...', '');
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
    } catch(err) {
      const msg = err.code === 'auth/wrong-password' ? 'Mot de passe incorrect.' :
                  err.code === 'auth/user-not-found' ? 'Aucun compte trouvé.' : err.message;
      showMsg(msg, 'error');
    }
  };

  // ── LOGOUT ──
  window.doLogout = async function() {
    if (_unsubscribe) _unsubscribe();
    await signOut(auth);
  };

  // ── SAVE PROFILE ──
  window.saveProfile = async function() {
    if (!_pageId) return;
    const photoUrl = document.getElementById('f-photo-url').value.trim();
    const data = {
      name: document.getElementById('f-name').value.trim(),
      tagline: document.getElementById('f-tagline').value.trim(),
      bio: document.getElementById('f-bio').value.trim(),
      country: document.getElementById('f-country').value.trim(),
      languages: document.getElementById('f-languages').value.trim(),
      photo: photoUrl,
      updated_at: serverTimestamp()
    };
    try {
      await updateDoc(doc(db, 'creators', _pageId), data);
      showToast('toast-profile', '✓ Profil sauvegardé — ta page publique est mise à jour !', 'success');
      if (photoUrl) document.getElementById('photo-preview').innerHTML = '<img src="' + photoUrl + '">';
    } catch(err) {
      showToast('toast-profile', 'Erreur: ' + err.message, 'error');
    }
  };

  // ── SAVE STATUS ──
  window.saveStatus = async function(status) {
    if (!_pageId) return;
    try {
      await updateDoc(doc(db, 'creators', _pageId), { status, updated_at: serverTimestamp() });
      ['active','soon','away'].forEach(s => {
        document.getElementById('btn-' + s).className = 'status-btn ' + (status === s ? s + '-status' : '');
      });
      showToast('toast-status', '✓ Statut mis à jour !', 'success');
    } catch(err) {
      showToast('toast-status', 'Erreur: ' + err.message, 'error');
    }
  };

  // ── SAVE LINKS ──
  window.saveLinks = async function() {
    if (!_pageId) return;
    const data = {
      link_telegram: document.getElementById('l-telegram').value.trim(),
      link_bongacams: document.getElementById('l-bongacams').value.trim(),
      link_stripchat: document.getElementById('l-stripchat').value.trim(),
      link_onlyfans: document.getElementById('l-onlyfans').value.trim(),
      link_instagram: document.getElementById('l-instagram').value.trim(),
      updated_at: serverTimestamp()
    };
    try {
      await updateDoc(doc(db, 'creators', _pageId), data);
      showToast('toast-links', '✓ Liens sauvegardés !', 'success');
    } catch(err) {
      showToast('toast-links', 'Erreur: ' + err.message, 'error');
    }
  };

  // ── UPLOAD CONTENT (Cloudinary) ──
  window.uploadContent = async function() {
    if (!_pageId) return;
    const file = document.getElementById('content-file').files[0];
    const type = document.getElementById('content-type').value;
    const tokens = parseInt(document.getElementById('content-tokens').value) || 0;
    if (!file) { showToast('toast-content', 'Sélectionne un fichier.', 'error'); return; }

    showToast('toast-content', 'Upload en cours...', '');

    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', 'honeymoon_upload');
    fd.append('folder', 'creators/' + _pageId + '/' + type);

    try {
      const res = await fetch('https://api.cloudinary.com/v1_1/dornchrow/auto/upload', { method: 'POST', body: fd });
      const result = await res.json();
      if (!result.secure_url) throw new Error('Upload échoué');

      // Sauvegarder dans Firestore /content
      const { addDoc } = await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");
      await addDoc(collection(db, 'content'), {
        creator_id: _pageId,
        type,
        url: result.secure_url,
        price_tokens: tokens,
        locked: tokens > 0,
        created_at: serverTimestamp()
      });
      showToast('toast-content', '✓ Contenu uploadé sur ta page !', 'success');
      document.getElementById('content-file').value = '';
    } catch(err) {
      showToast('toast-content', 'Erreur: ' + err.message, 'error');
    }
  };

  // ── UPLOAD PHOTO PROFILE ──
  window.uploadPhoto = async function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', 'honeymoon_upload');
    fd.append('folder', 'creators/' + _pageId + '/hero');
    try {
      const res = await fetch('https://api.cloudinary.com/v1_1/dornchrow/auto/upload', { method: 'POST', body: fd });
      const result = await res.json();
      if (result.secure_url) {
        document.getElementById('f-photo-url').value = result.secure_url;
        document.getElementById('photo-preview').innerHTML = '<img src="' + result.secure_url + '">';
      }
    } catch(err) { console.warn('Photo upload error:', err); }
  };

  // ── HELPERS ──
  function showMsg(text, type) {
    const el = document.getElementById('login-msg');
    el.textContent = text;
    el.style.color = type === 'error' ? '#fca5a5' : type === 'success' ? '#86efac' : 'rgba(245,240,232,0.6)';
  }

  function showToast(id, text, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'toast ' + type;
    el.style.display = 'block';
    if (type !== '') setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  window.switchTab = function(tab, btn) {
    document.querySelectorAll('.dash-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.dash-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('section-' + tab).classList.add('active');
    btn.classList.add('active');
  };
</script>

</body>
</html>
